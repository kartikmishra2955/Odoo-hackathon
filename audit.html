<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Management</title>

    <link rel="stylesheet" href="audit.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="sidebar">
        <h1>AssetFlow</h1>

        <a href="dashboard.html">Dashboard</a>
        <a href="maintenance.html">Maintenance</a>
        <a href="audit.html" class="active">Audit</a>
        <a href="risk.html">Risk Assets</a>
    </div>

    <div class="main">

        <div class="header">
            <h2>Audit Management</h2>

            <button class="create-btn">
                + Create Audit
            </button>
        </div>

        <div class="table-box">

            <table>
                <tr>
                    <th>Audit ID</th>
                    <th>Asset ID</th>
                    <th>Auditor</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>

                <tr>
                    <td>AUD-001</td>
                    <td>ASSET-101</td>
                    <td>Anand</td>
                    <td><span class="status open">OPEN</span></td>

                    <td>
                        <button class="action-btn start">Start Audit</button>
                    </td>
                </tr>

                <tr>
                    <td>AUD-002</td>
                    <td>ASSET-204</td>
                    <td>Rahul</td>
                    <td><span class="status progress">IN PROGRESS</span></td>

                    <td>
                        <button class="action-btn close">Close Audit</button>
                    </td>
                </tr>

            </table>

        </div>

    </div>

</div>

<script src="audit.js"></script>

</body>
</html>
